<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Share.mk — API/AI first file uploads</title>
  <link rel="llmstxt" href="/llms.txt" />
  <script src="https://cdn.jsdelivr.net/npm/tus-js-client@3/dist/tus.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #fafafa;
      --card:       #ffffff;
      --border:     #e4e4e7;
      --border-hover: #a1a1aa;
      --text:       #09090b;
      --muted:      #71717a;
      --subtle:     #f4f4f5;
      --primary:    #18181b;
      --primary-fg: #fafafa;
      --success:    #16a34a;
      --error:      #dc2626;
      --radius:     0.5rem;
      --radius-lg:  0.75rem;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    /* Header */
    header { margin-bottom: 1.75rem; }
    h1 {
      font-size: 1.375rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .subtitle {
      font-size: 0.875rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }

    /* Footer links */
    .footer {
      margin-top: 1.25rem;
      display: flex;
      gap: 1.25rem;
      justify-content: center;
    }
    .footer a {
      font-size: 0.75rem;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s;
    }
    .footer a:hover { color: var(--text); }

    /* Card */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 1px 8px rgba(0,0,0,0.03);
    }

    /* Expiry pills */
    .section-label {
      display: block;
      font-size: 0.6875rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.5rem;
    }
    .pills {
      display: flex;
      gap: 0.375rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }
    .pill {
      padding: 0.3rem 0.75rem;
      border-radius: 9999px;
      border: 1px solid var(--border);
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      background: none;
      color: var(--muted);
      transition: border-color 0.1s, color 0.1s, background 0.1s;
    }
    .pill:hover { border-color: var(--border-hover); color: var(--text); }
    .pill.active {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--primary-fg);
    }

    /* Drop zone */
    .dropzone {
      position: relative;
      border: 1.5px dashed var(--border);
      border-radius: var(--radius);
      padding: 2.5rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      user-select: none;
    }
    .dropzone:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(24, 24, 27, 0.15);
    }
    .dropzone:hover,
    .dropzone.drag-over {
      border-color: var(--primary);
      background: #f9f9f9;
    }
    .dropzone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }
    .dz-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.5rem;
      height: 2.5rem;
      background: var(--subtle);
      border-radius: 0.5rem;
      margin-bottom: 0.75rem;
      color: var(--muted);
    }
    .dz-title {
      font-size: 0.9375rem;
      font-weight: 500;
    }
    .dz-sub {
      font-size: 0.8125rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }

    /* File list */
    .file-list {
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    /* File item */
    .file-item {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.75rem 0.875rem;
      animation: slide-in 0.15s ease;
    }
    @keyframes slide-in {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .file-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .file-icon { color: var(--muted); flex-shrink: 0; }
    .file-name {
      font-size: 0.875rem;
      font-weight: 500;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-size {
      font-size: 0.75rem;
      color: var(--muted);
      flex-shrink: 0;
    }

    /* Progress */
    .progress-track {
      height: 3px;
      background: var(--subtle);
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 0.4rem;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 9999px;
      width: 0%;
      transition: width 0.2s ease;
    }
    .file-status { font-size: 0.75rem; color: var(--muted); }

    /* URL result row */
    .url-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.375rem;
      padding: 0.375rem 0.5rem;
      background: var(--subtle);
      border-radius: 0.375rem;
    }
    .url-text {
      font-size: 0.75rem;
      font-family: ui-monospace, 'SF Mono', monospace;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }
    .copy-btn {
      padding: 0.2rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 0.3rem;
      font-size: 0.6875rem;
      font-weight: 500;
      background: var(--card);
      cursor: pointer;
      color: var(--text);
      transition: background 0.1s;
      flex-shrink: 0;
    }
    .copy-btn:hover { background: var(--border); }
    .copy-btn.copied { color: var(--success); border-color: var(--success); }

    /* Password input */
    .input {
      width: 100%;
      padding: 0.45rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font: inherit;
      font-size: 0.875rem;
      background: var(--card);
      color: var(--text);
      margin-bottom: 1.25rem;
    }
    .input:focus { outline: none; border-color: var(--primary); }

    /* Manage link */
    .url-label {
      font-size: 0.6875rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-top: 0.625rem;
    }
    .warn {
      font-size: 0.75rem;
      color: #92400e;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 0.375rem;
      padding: 0.375rem 0.5rem;
      margin-top: 0.375rem;
    }
    .badge {
      display: inline-block;
      font-size: 0.6875rem;
      font-weight: 500;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 0 0.45rem;
      margin-left: 0.375rem;
    }

    .retry-btn {
      margin-left: 0.375rem;
      padding: 0.1rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 0.3rem;
      font-size: 0.6875rem;
      font-weight: 500;
      background: var(--card);
      color: var(--text);
      cursor: pointer;
    }
    .retry-btn:hover { background: var(--border); }

    .text-success { color: var(--success); }
    .text-error   { color: var(--error); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Share.mk</h1>
      <p class="subtitle">API/AI first file uploads</p>
    </header>

    <div class="card">
      <p class="section-label" id="lbl-expires">Expires in</p>
      <div class="pills" data-group="expires" role="group" aria-labelledby="lbl-expires">
        <button class="pill" data-value="1h" aria-pressed="false">1h</button>
        <button class="pill" data-value="6h" aria-pressed="false">6h</button>
        <button class="pill active" data-value="24h" aria-pressed="true">24h</button>
        <button class="pill" data-value="7d" aria-pressed="false">7d</button>
        <button class="pill" data-value="30d" aria-pressed="false">30d</button>
      </div>

      <label class="section-label" for="password">Password <span style="text-transform:none;letter-spacing:0;font-weight:400">(optional)</span></label>
      <input class="input" id="password" type="password" autocomplete="new-password" placeholder="Leave empty for a public link" />

      <div class="dropzone" id="dropzone">
        <input type="file" id="file-input" multiple aria-label="Choose files to upload" />
        <div class="dz-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        </div>
        <p class="dz-title">Drop files here</p>
        <p class="dz-sub">or click to browse</p>
      </div>

      <div class="file-list" id="file-list"></div>
    </div>

    <nav class="footer">
      <a href="/docs">API docs</a>
      <a href="/openapi.json">OpenAPI</a>
      <a href="/llms.txt">llms.txt</a>
    </nav>
  </div>

  <script>
    const options = { expires: '24h' }

    // Option pills (one active per group)
    document.querySelectorAll('.pills').forEach(group => {
      group.querySelectorAll('.pill').forEach(pill => {
        pill.addEventListener('click', () => {
          group.querySelectorAll('.pill').forEach(p => {
            p.classList.remove('active')
            p.setAttribute('aria-pressed', 'false')
          })
          pill.classList.add('active')
          pill.setAttribute('aria-pressed', 'true')
          options[group.dataset.group] = pill.dataset.value
        })
      })
    })

    // Drag & drop
    const dropzone = document.getElementById('dropzone')
    const fileInput = document.getElementById('file-input')

    dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag-over') })
    dropzone.addEventListener('dragleave', e => { if (!dropzone.contains(e.relatedTarget)) dropzone.classList.remove('drag-over') })
    dropzone.addEventListener('drop', e => {
      e.preventDefault()
      dropzone.classList.remove('drag-over')
      upload(Array.from(e.dataTransfer.files))
    })
    fileInput.addEventListener('change', () => {
      upload(Array.from(fileInput.files))
      fileInput.value = ''
    })

    function fmt(bytes) {
      if (!bytes) return '0 B'
      const u = ['B','KB','MB','GB'], i = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), 3)
      return (bytes / 1024 ** i).toFixed(i ? 1 : 0) + ' ' + u[i]
    }

    function upload(files) { files.forEach(uploadOne) }

    // The server allows 5 concurrent uploads per IP; stay below that so a
    // large drop is queued instead of rejected.
    const MAX_PARALLEL = 3
    const queue = []
    let active = 0
    function schedule(start) { queue.push(start); pump() }
    function pump() {
      while (active < MAX_PARALLEL && queue.length) {
        active++
        queue.shift()()
      }
    }
    function finished() { active--; pump() }

    // Retry transient failures (busy server, locks) but not other 4xx.
    function shouldRetry(err) {
      const s = err.originalResponse ? err.originalResponse.getStatus() : 0
      if (s === 429 || s === 409 || s === 423) return true
      return !(s >= 400 && s < 500)
    }

    function friendlyError(err) {
      const res = err.originalResponse
      const s = res ? res.getStatus() : 0
      if (s === 429) return 'The server is busy. Please try again in a moment.'
      if (s === 413) return 'This file is larger than the maximum allowed size.'
      if (s >= 400 && s < 500) {
        // tusd errors look like "ERR_CODE: message".
        const body = (res.getBody() || '').trim()
        return body.replace(/^ERR_[A-Z_]+:\s*/, '') || 'The upload was rejected.'
      }
      return 'Network or server error.'
    }

    function uploadOne(file) {
      const id  = crypto.randomUUID()
      const el  = document.createElement('div')
      el.className = 'file-item'
      el.id = 'item-' + id
      el.innerHTML = `
        <div class="file-row">
          <svg class="file-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
          </svg>
          <span class="file-name" title="${esc(file.name)}">${esc(file.name)}</span>
          <span class="file-size">${fmt(file.size)}</span>
        </div>
        <div class="progress-track" id="pt-${id}"><div class="progress-fill" id="pf-${id}"></div></div>
        <div class="file-status" id="st-${id}">Queued…</div>
      `
      document.getElementById('file-list').prepend(el)

      const password = document.getElementById('password').value
      const metadata = {
        filename: file.name,
        filetype: file.type || 'application/octet-stream',
        'expires-in': options.expires,
      }
      if (password) metadata.password = password
      let manageURL = ''
      let shareURL = ''

      const tusUpload = new tus.Upload(file, {
        endpoint: '/files/',
        chunkSize: 5 * 1024 * 1024,
        retryDelays: [0, 1000, 3000, 5000, 10000],
        onShouldRetry(err) {
          const retry = shouldRetry(err)
          if (retry) document.getElementById('st-' + id).textContent = 'Retrying…'
          return retry
        },
        metadata,
        // The management token is only returned when the upload is created,
        // so never resume a previous upload from browser storage.
        storeFingerprintForResuming: false,
        onAfterResponse(req, res) {
          manageURL = res.getHeader('Upload-Manage-URL') || manageURL
          shareURL = res.getHeader('Upload-Share-URL') || shareURL
        },
        onProgress(sent, total) {
          const pct = total ? Math.round(sent / total * 100) : 0
          document.getElementById('pf-' + id).style.width = pct + '%'
          document.getElementById('st-' + id).textContent = pct + '%'
        },
        onSuccess() {
          finished()
          const link = shareURL || tusUpload.url
          // Same file, always downloaded instead of previewed.
          const dlLink = shareURL ? shareURL.replace('/files/', '/dl/') : tusUpload.url + '?dl=1'
          document.getElementById('pt-' + id).style.display = 'none'
          let html =
            `<span class="text-success">✓ Uploaded</span>` +
            (password ? `<span class="badge">password protected</span>` : '') +
            `<p class="url-label">Share link (opens in browser)</p>` +
            `<div class="url-row">` +
              `<span class="url-text" title="${esc(link)}">${esc(link)}</span>` +
              `<button class="copy-btn" id="cp-${id}">Copy</button>` +
            `</div>` +
            `<p class="url-label">Direct download link</p>` +
            `<div class="url-row">` +
              `<span class="url-text" title="${esc(dlLink)}">${esc(dlLink)}</span>` +
              `<button class="copy-btn" id="cpd-${id}">Copy</button>` +
            `</div>`
          if (manageURL) {
            html +=
              `<p class="url-label">Delete link</p>` +
              `<div class="url-row">` +
                `<span class="url-text" title="${esc(manageURL)}">${esc(manageURL)}</span>` +
                `<button class="copy-btn" id="cpm-${id}">Copy</button>` +
              `</div>` +
              `<p class="warn">Keep this link private and save it somewhere. It's the only way to delete the file before it expires, and it can't be recovered.</p>`
          }
          document.getElementById('st-' + id).innerHTML = html
          document.getElementById('cp-' + id).addEventListener('click', () => copyURL(link, 'cp-' + id))
          document.getElementById('cpd-' + id).addEventListener('click', () => copyURL(dlLink, 'cpd-' + id))
          if (manageURL) {
            document.getElementById('cpm-' + id).addEventListener('click', () => copyURL(manageURL, 'cpm-' + id))
          }
        },
        onError(err) {
          finished()
          document.getElementById('pt-' + id).style.display = 'none'
          document.getElementById('st-' + id).innerHTML =
            `<span class="text-error">Upload failed. ${esc(friendlyError(err))}</span>` +
            `<button class="retry-btn" id="rt-${id}">Retry</button>`
          document.getElementById('rt-' + id).addEventListener('click', () => {
            document.getElementById('pt-' + id).style.display = ''
            document.getElementById('st-' + id).textContent = 'Queued…'
            schedule(() => tusUpload.start())
          })
        },
      })
      schedule(() => {
        document.getElementById('st-' + id).textContent = 'Starting…'
        tusUpload.start()
      })
    }

    function copyURL(url, btnId) {
      navigator.clipboard.writeText(url).then(() => {
        const btn = document.getElementById(btnId)
        btn.textContent = 'Copied!'
        btn.classList.add('copied')
        setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied') }, 2000)
      })
    }

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    }
  </script>
</body>
</html>
